<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/mateIcon.png">
    <script src="js/main.js" defer></script>
    <title>Tienda de Mates</title>
  </head>
  <body>
    
    <header class="cabecera">
      <div class="marca">
        <h1>Termos y mates</h1>
        <p>¡ARMA TU PEDIDO!</p>
      </div>
      
      <nav>
        <input id="barraBusqueda" type="text" placeholder="Buscar producto..." />
      </nav>
    </header>

    <main>
      <section class="contenedorProductos">
        <h2>LISTA DE PRODUCTOS</h2>
      </section>

      <div id="contenedorProductos" class="grillaProductos"></div>
    </main>

    <footer class="barraAbajo">
      <div class="carrito">
        <span>TU ORDEN:</span>
        <span id="resumenCarritoTexto">0 ítems</span>
      </div>
      <div class="precioTotal">
        Total: <span id="precioTotal">$0.00</span>
      </div>
      <button class="btn-pagar" onclick="mostrarCarrito()">VER CARRITO / PAGAR</button>
    </footer>

    <div id="contenedorCarrito" class="carritoEscondido">
        </div>

  </body>
</html>
