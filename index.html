<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a Termos y Mates</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/mateIcon.png">
    <script src="./src/login.js" defer></script>
</head>

<body>

    <header class="cabecera">
        <div class="marca">
            <h1>Termos y Mates</h1>
            <p>¡BIENVENIDO!</p>
        </div>
        <button id="cambiar-modo">Cambiar modo</button>
    </header>

    <main class="welcome-container">

        <form id="welcome-form" class="form-login">
            <h2>Ingresa tu nombre para continuar</h2>
            <label for="user-name">Nombre:</label>
            <input type="text" id="user-name" required placeholder="Ej: Xabi Gallardo">
            <button type="submit" class="btn-ingresar">INGRESAR A LA TIENDA</button>
            <div class="help-container">
                <p class="help-text">¿Tienes problemas? <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" target="_blank" class="help-link">Ingresa aca</a></p>
            </div>
        </form>

    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p>Desarrollado por:</p>
            <div class="footer-developers">
                <a href="https://github.com/EmiNahuelGarcia" target="_blank" class="developer-link">Garcia Emiliano</a>
                <a href="https://github.com/GricelDiazZabala" target="_blank" class="developer-link">Zabala Gricel</a>
            </div>
        </div>
    </footer>

</body>

</html>
